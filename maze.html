<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2D Labirent Oyunu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { overscroll-behavior: none; touch-action: manipulation; }
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a45 100%);
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        h1 {
            margin-bottom: 4px;
            color: #ffd166;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            font-size: clamp(18px, 5vw, 28px);
        }
        .info {
            margin-bottom: 8px;
            color: #cccccc;
            font-size: 12px;
            text-align: center;
        }
        .hud {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .hud span { color: #ffd166; font-weight: bold; }
        canvas {
            background: #0f0f1a;
            border: 3px solid #ffd166;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255, 209, 102, 0.3);
            max-width: 95vw;
            max-height: 60vh;
            touch-action: none;
        }
        .controls {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 8px 14px;
            background: #ffd166;
            color: #1e1e2f;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn:active { transform: translateY(1px); background: #e0b850; }
        .message {
            margin-top: 10px;
            min-height: 24px;
            font-size: 16px;
            font-weight: bold;
            color: #06d6a0;
            text-align: center;
        }
        .dpad {
            margin-top: 14px;
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px 70px;
            gap: 6px;
        }
        .dbtn {
            background: #ffd166;
            color: #1e1e2f;
            border: none;
            border-radius: 12px;
            font-size: 28px;
            font-weight: bold;
            user-select: none;
            cursor: pointer;
            box-shadow: 0 3px 0 #b89248;
        }
        .dbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b89248; }
        .dbtn.empty { background: transparent; box-shadow: none; pointer-events: none; }
        #up    { grid-column: 2; grid-row: 1; }
        #left  { grid-column: 1; grid-row: 2; }
        #down  { grid-column: 2; grid-row: 3; }
        #right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>
    <h1>🎮 2D Labirent Oyunu</h1>
    <div class="info">Hedefe 🏁 ulaş, canavarlardan 👻 kaç! Tuşları veya yön butonlarını kullan.</div>
    <div class="hud">
        Seviye: <span id="level">1</span>/<span id="totalLevels">2</span>
        | Hamle: <span id="moves">0</span>
        | Süre: <span id="time">0</span>s
    </div>
    <canvas id="game" width="600" height="600"></canvas>
    <div class="message" id="message"></div>
    <div class="controls">
        <button class="btn" id="restart">🔄 Yenile</button>
        <button class="btn" id="prev">⏮️ Önceki</button>
        <button class="btn" id="next">⏭️ Sonraki</button>
    </div>
    <div class="dpad">
        <button class="dbtn" id="up">▲</button>
        <button class="dbtn" id="left">◀</button>
        <button class="dbtn empty"></button>
        <button class="dbtn" id="down">▼</button>
        <button class="dbtn" id="right">▶</button>
    </div>

    <script>
        const rawLevels = [
            [
                "###############",
                "#P............#",
                "#.###.#####.#.#",
                "#...#.#...#.#.#",
                "###.#.#.#.#.#.#",
                "#...#.M.#.#...#",
                "#.#######.###.#",
                "#.........#...#",
                "#####.#####.###",
                "#.....#.....M.#",
                "#.###.#.#####.#",
                "#.#...#.....#.#",
                "#.#.#######.#.#",
                "#...........#G#",
                "###############"
            ],
            [
                "###################",
                "#P..#.........#...#",
                "#.#.#.#######.#.#.#",
                "#.#...#.....#...#.#",
                "#.#####.###.#####.#",
                "#...M...#.#.....M.#",
                "#######.#.#######.#",
                "#.......#.........#",
                "#.#############.###",
                "#.#......M....#...#",
                "#.#.#########.###.#",
                "#...#.......#.....#",
                "#####.#####.#####.#",
                "#.....#...#.....#.#",
                "#.#####.#.#####.#.#",
                "#.M...#.#.......#.#",
                "#####.#.#########.#",
                "#.................G",
                "###################"
            ]
        ];

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const messageEl = document.getElementById("message");
        const levelEl = document.getElementById("level");
        const movesEl = document.getElementById("moves");
        const timeEl = document.getElementById("time");

        let currentLevel = 0;
        let maze = [];
        let player = { x: 0, y: 0 };
        let goal = { x: 0, y: 0 };
        let monsters = [];
        let cellSize = 30;
        let moves = 0;
        let startTime = Date.now();
        let won = false;
        let lost = false;
        let timerInterval = null;
        let monsterInterval = null;

        function loadLevel(idx) {
            won = false;
            lost = false;
            messageEl.textContent = "";
            messageEl.style.color = "#06d6a0";
            moves = 0;
            startTime = Date.now();
            movesEl.textContent = moves;
            timeEl.textContent = 0;
            levelEl.textContent = idx + 1;
            monsters = [];

            const raw = rawLevels[idx];
            maze = raw.map(row => row.split(""));

            for (let y = 0; y < maze.length; y++) {
                for (let x = 0; x < maze[y].length; x++) {
                    if (maze[y][x] === "P") {
                        player = { x, y };
                        maze[y][x] = ".";
                    } else if (maze[y][x] === "G") {
                        goal = { x, y };
                    } else if (maze[y][x] === "M") {
                        monsters.push({ x, y, dx: 0, dy: 0 });
                        maze[y][x] = ".";
                    }
                }
            }

            const cols = maze[0].length;
            const rows = maze.length;
            cellSize = Math.floor(Math.min(600 / cols, 600 / rows));
            canvas.width = cellSize * cols;
            canvas.height = cellSize * rows;

            draw();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!won && !lost) timeEl.textContent = Math.floor((Date.now() - startTime) / 1000);
            }, 250);
            if (monsterInterval) clearInterval(monsterInterval);
            monsterInterval = setInterval(moveMonsters, 500);
        }

        function draw() {
            ctx.fillStyle = "#0f0f1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < maze.length; y++) {
                for (let x = 0; x < maze[y].length; x++) {
                    const cell = maze[y][x];
                    const px = x * cellSize;
                    const py = y * cellSize;
                    if (cell === "#") {
                        const grad = ctx.createLinearGradient(px, py, px + cellSize, py + cellSize);
                        grad.addColorStop(0, "#4a4a7a");
                        grad.addColorStop(1, "#2a2a55");
                        ctx.fillStyle = grad;
                        ctx.fillRect(px, py, cellSize, cellSize);
                        ctx.strokeStyle = "#1a1a3a";
                        ctx.strokeRect(px, py, cellSize, cellSize);
                    } else {
                        ctx.fillStyle = "#1a1a2e";
                        ctx.fillRect(px, py, cellSize, cellSize);
                    }
                }
            }

            const gx = goal.x * cellSize + cellSize / 2;
            const gy = goal.y * cellSize + cellSize / 2;
            const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 200);
            ctx.fillStyle = `rgba(6, 214, 160, ${pulse})`;
            ctx.beginPath();
            ctx.arc(gx, gy, cellSize / 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.font = `${cellSize * 0.6}px serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🏁", gx, gy);

            const ppx = player.x * cellSize + cellSize / 2;
            const ppy = player.y * cellSize + cellSize / 2;
            ctx.fillStyle = "#ffd166";
            ctx.beginPath();
            ctx.arc(ppx, ppy, cellSize / 2.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#1e1e2f";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#1e1e2f";
            ctx.beginPath();
            ctx.arc(ppx - cellSize * 0.12, ppy - cellSize * 0.05, cellSize * 0.06, 0, Math.PI * 2);
            ctx.arc(ppx + cellSize * 0.12, ppy - cellSize * 0.05, cellSize * 0.06, 0, Math.PI * 2);
            ctx.fill();

            // Canavarlar
            for (const m of monsters) {
                const mx = m.x * cellSize + cellSize / 2;
                const my = m.y * cellSize + cellSize / 2;
                const r = cellSize / 2.6;
                ctx.fillStyle = "#e63946";
                ctx.beginPath();
                ctx.arc(mx, my - cellSize * 0.05, r, Math.PI, 0);
                ctx.lineTo(mx + r, my + r * 0.8);
                ctx.lineTo(mx + r * 0.5, my + r * 0.5);
                ctx.lineTo(mx, my + r * 0.8);
                ctx.lineTo(mx - r * 0.5, my + r * 0.5);
                ctx.lineTo(mx - r, my + r * 0.8);
                ctx.closePath();
                ctx.fill();
                // gözler
                ctx.fillStyle = "#fff";
                ctx.beginPath();
                ctx.arc(mx - cellSize * 0.13, my - cellSize * 0.05, cellSize * 0.1, 0, Math.PI * 2);
                ctx.arc(mx + cellSize * 0.13, my - cellSize * 0.05, cellSize * 0.1, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#000";
                ctx.beginPath();
                ctx.arc(mx - cellSize * 0.13, my - cellSize * 0.05, cellSize * 0.05, 0, Math.PI * 2);
                ctx.arc(mx + cellSize * 0.13, my - cellSize * 0.05, cellSize * 0.05, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function isWall(x, y) {
            return y < 0 || y >= maze.length || x < 0 || x >= maze[0].length || maze[y][x] === "#";
        }

        function monsterAt(x, y) {
            return monsters.some(m => m.x === x && m.y === y);
        }

        function handleCaught() {
            if (lost || won) return;
            lost = true;
            messageEl.style.color = "#ff6b6b";
            messageEl.textContent = "👻 Yakalandın! Seviye yenileniyor...";
            clearInterval(monsterInterval);
            clearInterval(timerInterval);
            draw();
            setTimeout(() => loadLevel(currentLevel), 1500);
        }

        function tryMove(dx, dy) {
            if (won || lost) return;
            let moved = false;
            while (true) {
                const nx = player.x + dx;
                const ny = player.y + dy;
                if (isWall(nx, ny)) break;
                player.x = nx;
                player.y = ny;
                moves++;
                moved = true;
                if (monsterAt(player.x, player.y)) {
                    movesEl.textContent = moves;
                    handleCaught();
                    return;
                }
                if (player.x === goal.x && player.y === goal.y) {
                    won = true;
                    const secs = Math.floor((Date.now() - startTime) / 1000);
                    messageEl.textContent = `🎉 Kazandın! ${moves} hamle, ${secs} saniye.`;
                    clearInterval(timerInterval);
                    clearInterval(monsterInterval);
                    break;
                }
                // Yan taraflarda açıklık varsa kavşaktayız — dur.
                const side1Open = !isWall(player.x + (-dy), player.y + dx);
                const side2Open = !isWall(player.x + dy, player.y + (-dx));
                if (side1Open || side2Open) break;
            }
            if (moved) {
                movesEl.textContent = moves;
                draw();
            }
        }

        function moveMonsters() {
            if (won || lost) return;
            const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
            for (const m of monsters) {
                let options = [];
                for (const [dx, dy] of dirs) {
                    if (!isWall(m.x + dx, m.y + dy)) options.push({ dx, dy });
                }
                if (options.length === 0) continue;
                // Çıkmaz değilse geri dönmemeye çalış
                const nonReverse = options.filter(o => !(o.dx === -m.dx && o.dy === -m.dy));
                if (nonReverse.length > 0) options = nonReverse;

                let chosen;
                if (Math.random() < 0.45) {
                    // Oyuncuya en yakınlaştıran yön
                    options.sort((a, b) => {
                        const da = Math.abs(m.x + a.dx - player.x) + Math.abs(m.y + a.dy - player.y);
                        const db = Math.abs(m.x + b.dx - player.x) + Math.abs(m.y + b.dy - player.y);
                        return da - db;
                    });
                    chosen = options[0];
                } else {
                    chosen = options[Math.floor(Math.random() * options.length)];
                }
                m.x += chosen.dx;
                m.y += chosen.dy;
                m.dx = chosen.dx;
                m.dy = chosen.dy;
                if (m.x === player.x && m.y === player.y) {
                    handleCaught();
                    return;
                }
            }
            draw();
        }

        document.addEventListener("keydown", e => {
            const k = e.key.toLowerCase();
            if (k === "arrowup" || k === "w") { tryMove(0, -1); e.preventDefault(); }
            else if (k === "arrowdown" || k === "s") { tryMove(0, 1); e.preventDefault(); }
            else if (k === "arrowleft" || k === "a") { tryMove(-1, 0); e.preventDefault(); }
            else if (k === "arrowright" || k === "d") { tryMove(1, 0); e.preventDefault(); }
        });

        function bindDir(id, dx, dy) {
            const el = document.getElementById(id);
            const handler = e => { e.preventDefault(); tryMove(dx, dy); };
            el.addEventListener("touchstart", handler, { passive: false });
            el.addEventListener("click", handler);
        }
        bindDir("up", 0, -1);
        bindDir("down", 0, 1);
        bindDir("left", -1, 0);
        bindDir("right", 1, 0);

        // Swipe (dokun-kaydır) kontrolü
        let touchStart = null;
        canvas.addEventListener("touchstart", e => {
            const t = e.touches[0];
            touchStart = { x: t.clientX, y: t.clientY };
        }, { passive: true });
        canvas.addEventListener("touchend", e => {
            if (!touchStart) return;
            const t = e.changedTouches[0];
            const dx = t.clientX - touchStart.x;
            const dy = t.clientY - touchStart.y;
            const absX = Math.abs(dx), absY = Math.abs(dy);
            if (Math.max(absX, absY) < 20) return;
            if (absX > absY) tryMove(dx > 0 ? 1 : -1, 0);
            else tryMove(0, dy > 0 ? 1 : -1);
            touchStart = null;
        }, { passive: true });

        document.getElementById("restart").addEventListener("click", () => loadLevel(currentLevel));
        document.getElementById("next").addEventListener("click", () => {
            currentLevel = (currentLevel + 1) % rawLevels.length;
            loadLevel(currentLevel);
        });
        document.getElementById("prev").addEventListener("click", () => {
            currentLevel = (currentLevel - 1 + rawLevels.length) % rawLevels.length;
            loadLevel(currentLevel);
        });

        setInterval(() => { if (!won) draw(); }, 100);

        loadLevel(0);
    </script>
</body>
</html>
