{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>2D Labirent Oyunu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a45 100%);
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            margin-bottom: 8px;
            color: #ffd166;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        .info {
            margin-bottom: 16px;
            color: #cccccc;
            font-size: 14px;
            text-align: center;
        }
        .hud {
            display: flex;
            gap: 24px;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .hud span { color: #ffd166; font-weight: bold; }
        canvas {
            background: #0f0f1a;
            border: 3px solid #ffd166;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255, 209, 102, 0.3);
        }
        .controls {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 18px;
            background: #ffd166;
            color: #1e1e2f;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover { background: #ffe08a; transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        .message {
            margin-top: 16px;
            min-height: 30px;
            font-size: 20px;
            font-weight: bold;
            color: #06d6a0;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>🎮 2D Labirent Oyunu</h1>
    <div class="info">
        Ok tuşları veya WASD ile hareket et. Sarı kareyi (🏁) bul!
    </div>
    <div class="hud">
        Seviye: <span id="level">1</span> /
        <span id="totalLevels">{{ levels|length }}</span>
        &nbsp;|&nbsp; Hamle: <span id="moves">0</span>
        &nbsp;|&nbsp; Süre: <span id="time">0</span>s
    </div>
    <canvas id="game" width="600" height="600"></canvas>
    <div class="message" id="message"></div>
    <div class="controls">
        <button id="restart">🔄 Seviyeyi Yenile</button>
        <button id="next">⏭️ Sonraki Seviye</button>
        <button id="prev">⏮️ Önceki Seviye</button>
    </div>

    {{ levels|json_script:"levelData" }}
    <script>
        const rawLevels = JSON.parse(document.getElementById("levelData").textContent);

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const messageEl = document.getElementById("message");
        const levelEl = document.getElementById("level");
        const movesEl = document.getElementById("moves");
        const timeEl = document.getElementById("time");

        let currentLevel = 0;
        let maze = [];
        let player = { x: 0, y: 0 };
        let goal = { x: 0, y: 0 };
        let cellSize = 30;
        let moves = 0;
        let startTime = Date.now();
        let won = false;
        let timerInterval = null;

        function loadLevel(idx) {
            won = false;
            messageEl.textContent = "";
            moves = 0;
            startTime = Date.now();
            movesEl.textContent = moves;
            timeEl.textContent = 0;
            levelEl.textContent = idx + 1;

            const raw = rawLevels[idx];
            maze = raw.map(row => row.split(""));

            for (let y = 0; y < maze.length; y++) {
                for (let x = 0; x < maze[y].length; x++) {
                    if (maze[y][x] === "P") {
                        player = { x, y };
                        maze[y][x] = ".";
                    } else if (maze[y][x] === "G") {
                        goal = { x, y };
                    }
                }
            }

            const cols = maze[0].length;
            const rows = maze.length;
            cellSize = Math.floor(Math.min(600 / cols, 600 / rows));
            canvas.width = cellSize * cols;
            canvas.height = cellSize * rows;

            draw();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!won) {
                    timeEl.textContent = Math.floor((Date.now() - startTime) / 1000);
                }
            }, 250);
        }

        function draw() {
            ctx.fillStyle = "#0f0f1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < maze.length; y++) {
                for (let x = 0; x < maze[y].length; x++) {
                    const cell = maze[y][x];
                    const px = x * cellSize;
                    const py = y * cellSize;
                    if (cell === "#") {
                        const grad = ctx.createLinearGradient(px, py, px + cellSize, py + cellSize);
                        grad.addColorStop(0, "#4a4a7a");
                        grad.addColorStop(1, "#2a2a55");
                        ctx.fillStyle = grad;
                        ctx.fillRect(px, py, cellSize, cellSize);
                        ctx.strokeStyle = "#1a1a3a";
                        ctx.strokeRect(px, py, cellSize, cellSize);
                    } else {
                        ctx.fillStyle = "#1a1a2e";
                        ctx.fillRect(px, py, cellSize, cellSize);
                    }
                }
            }

            // Hedef
            const gx = goal.x * cellSize + cellSize / 2;
            const gy = goal.y * cellSize + cellSize / 2;
            const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 200);
            ctx.fillStyle = `rgba(6, 214, 160, ${pulse})`;
            ctx.beginPath();
            ctx.arc(gx, gy, cellSize / 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.font = `${cellSize * 0.6}px serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🏁", gx, gy);

            // Oyuncu
            const ppx = player.x * cellSize + cellSize / 2;
            const ppy = player.y * cellSize + cellSize / 2;
            ctx.fillStyle = "#ffd166";
            ctx.beginPath();
            ctx.arc(ppx, ppy, cellSize / 2.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#1e1e2f";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Göz detayları
            ctx.fillStyle = "#1e1e2f";
            ctx.beginPath();
            ctx.arc(ppx - cellSize * 0.12, ppy - cellSize * 0.05, cellSize * 0.06, 0, Math.PI * 2);
            ctx.arc(ppx + cellSize * 0.12, ppy - cellSize * 0.05, cellSize * 0.06, 0, Math.PI * 2);
            ctx.fill();
        }

        function tryMove(dx, dy) {
            if (won) return;
            const nx = player.x + dx;
            const ny = player.y + dy;
            if (ny < 0 || ny >= maze.length || nx < 0 || nx >= maze[0].length) return;
            if (maze[ny][nx] === "#") return;
            player.x = nx;
            player.y = ny;
            moves++;
            movesEl.textContent = moves;
            if (player.x === goal.x && player.y === goal.y) {
                won = true;
                const secs = Math.floor((Date.now() - startTime) / 1000);
                messageEl.textContent = `🎉 Kazandın! ${moves} hamle, ${secs} saniye.`;
                clearInterval(timerInterval);
            }
            draw();
        }

        document.addEventListener("keydown", e => {
            const k = e.key.toLowerCase();
            if (k === "arrowup" || k === "w") { tryMove(0, -1); e.preventDefault(); }
            else if (k === "arrowdown" || k === "s") { tryMove(0, 1); e.preventDefault(); }
            else if (k === "arrowleft" || k === "a") { tryMove(-1, 0); e.preventDefault(); }
            else if (k === "arrowright" || k === "d") { tryMove(1, 0); e.preventDefault(); }
        });

        document.getElementById("restart").addEventListener("click", () => loadLevel(currentLevel));
        document.getElementById("next").addEventListener("click", () => {
            currentLevel = (currentLevel + 1) % rawLevels.length;
            loadLevel(currentLevel);
        });
        document.getElementById("prev").addEventListener("click", () => {
            currentLevel = (currentLevel - 1 + rawLevels.length) % rawLevels.length;
            loadLevel(currentLevel);
        });

        // Animasyon için hedefi titret
        setInterval(() => { if (!won) draw(); }, 100);

        loadLevel(0);
    </script>
</body>
</html>
